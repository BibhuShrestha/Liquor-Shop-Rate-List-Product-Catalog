{% extends 'base.html' %}
{% block title %}Categories{% endblock %}
{% block content %}
<h2 class="mb-4">Categories</h2>
<div class="row">
    <div class="col-md-5">
        <div class="card p-4">
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Category Name</label>
                    <input type="text" class="form-control" name="name" required>
                </div>
                <button class="btn btn-dark">Add Category</button>
            </form>
        </div>
    </div>
    <div class="col-md-7">
        <div class="card p-4">
            <table class="table mb-0">
                <thead>
                    <tr><th>Name</th><th>Slug</th></tr>
                </thead>
                <tbody>
                    {% for category in categories %}
                    <tr>
                        <td>{{ category.name }}</td>
                        <td>{{ category.slug }}</td>
                    </tr>
                    {% else %}
                    <tr><td colspan="2" class="text-center text-muted">No categories found.</td></tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
