{% extends 'base.html' %}
{% block title %}Dashboard{% endblock %}
{% block content %}
<h2 class="mb-4">Dashboard</h2>

<div class="row g-3 mb-4">
    <div class="col-6 col-md-3">
        <div class="card p-4 text-center">
            <div class="text-muted small mb-1">Products</div>
            <h3 class="mb-0">{{ total_products }}</h3>
        </div>
    </div>
    <div class="col-6 col-md-3">
        <div class="card p-4 text-center">
            <div class="text-muted small mb-1">Categories</div>
            <h3 class="mb-0">{{ total_categories }}</h3>
        </div>
    </div>
    <div class="col-6 col-md-3">
        <div class="card p-4 text-center">
            <div class="text-muted small mb-1">Variants</div>
            <h3 class="mb-0">{{ total_variants }}</h3>
        </div>
    </div>
    <div class="col-6 col-md-3">
        <div class="card p-4 text-center">
            <div class="text-muted small mb-1">Available</div>
            <h3 class="mb-0" style="color:#16a34a;">{{ available_products }}</h3>
        </div>
    </div>
</div>

<div class="d-flex gap-2 flex-wrap">
    <a href="{{ url_for('main.add_product') }}" class="btn btn-dark">+ Add Product</a>
    <a href="{{ url_for('main.import_products') }}" class="btn btn-outline-dark">Import</a>
    <a href="{{ url_for('main.export_page') }}" class="btn btn-outline-dark">Export</a>
    <a href="{{ url_for('main.print_rate_list') }}" class="btn btn-outline-secondary" target="_blank">Print Rate List</a>
</div>
{% endblock %}
